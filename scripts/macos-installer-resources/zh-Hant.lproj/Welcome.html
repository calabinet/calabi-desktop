<head><meta charset="utf-8"><title>安裝 Calabi</title></head>
<body style="font: 13px -apple-system, sans-serif">
  <h2>安裝或更新 Calabi</h2>
  <p>此安裝套件會安裝 Calabi 和它的背景服務。</p>
  <p>安裝過程中，macOS 可能會提示「安裝程式想要修改 Mac 上的 App」，請你確認是否允許繼續。</p>
  <p>如果你剛剛主動開啟了可信來源的 Calabi 安裝套件，請按<strong>「允許」</strong>繼續。若你沒有發起安裝，或不確定安裝套件的來源，請按<strong>「不允許」</strong>並結束安裝程式。</p>
</body>
</html>
