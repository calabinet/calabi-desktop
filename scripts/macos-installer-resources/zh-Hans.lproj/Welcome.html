<!doctype html>
<html lang="zh-Hans">
<head><meta charset="utf-8"><title>安装 Calabi</title></head>
<body style="font: 13px -apple-system, sans-serif">
  <h2>安装或更新 Calabi</h2>
  <p>此安装包会安装 Calabi 和它的后台服务。</p>
  <p>安装过程中，macOS 可能会提示「安装器想修改 Mac 上的 App」，请你确认是否允许继续。</p>
  <p>如果你刚刚主动打开了可信来源的 Calabi 安装包，请点<strong>「允许」</strong>继续。若你没有发起安装，或不确定安装包的来源，请点<strong>「不允许」</strong>并退出安装。</p>
</body>
</html>
